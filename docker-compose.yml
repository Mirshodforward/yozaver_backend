services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: typerush
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-typerush}
      POSTGRES_DB: typerush
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typerush"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: migration
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main.js"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://typerush:${POSTGRES_PASSWORD:-typerush}@db:5432/typerush?schema=public
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  pgdata:
